name: Flutter Port Loop

on:
  schedule:
    - cron: "0 */6 * * *" # every 6h: 00/06/12/18 UTC (= 03/09/15/21 Gaza); 6h spacing clears Claude's 5h rolling window
  workflow_dispatch: # manual trigger

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: flutter-loop
  cancel-in-progress: false # queue runs — never kill one that already spent Claude budget

jobs:
  reap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Reset stale ai-in-progress issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/reap-stale.sh

  loop:
    needs: reap
    if: always() # run the loop even if the reaper hiccups
    runs-on: ubuntu-latest
    timeout-minutes: 45 # one small task should never take longer; guards hung runs from locking issues
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Official Dart/Flutter skills plugin (flutter/agent-plugins) — architecture,
          # responsive layout, widget tests, primary constructors, etc.
          plugin_marketplaces: "https://github.com/flutter/agent-plugins.git"
          plugins: "dart-flutter@dart-flutter"

          prompt: |
            REPO: ${{ github.repository }}

            This is a ralph-loop style run: do exactly ONE task, then stop.

            ## Pick the task
            This repo uses a label lifecycle for the loop: `ai-ready` (pick this up) →
            `ai-in-progress` (you're on it) → `ai-in-review` (PR open, waiting on human) →
            `ai-blocked` (stuck, needs human input — never pick these up).

            1. `gh issue list --state open --label ai-ready` — if any, take the highest
               priority one (label `p0` > `p1` > `p2`; unlabeled priority = lowest), oldest
               first as tiebreaker. Immediately relabel it `ai-in-progress` (remove `ai-ready`)
               so a concurrent run won't double-pick it. Work on a new branch off master named
               for the issue.
            2. If there are no `ai-ready` issues, fall back to TASKS.md — pick the next
               unchecked task, top to bottom, respecting its "Notes for the loop" section.
               Work on a new branch off master named for the task.

            Only ever work ONE of the above per run — never both.

            Source of truth: spec.md (product + local schema), UI_SPEC.md (design tokens).
            Prototype is LOCAL-ONLY: drift (the Dart equivalent of SQLDelight, which has no
            Dart codegen target) for on-device persistence — never add Supabase, httpSMS, or
            any hosted backend.

            ## Skills — use them, don't just read code
            - Use the `tdd` skill for any behavior change under flutter/: red (failing test)
              before green (implementation), one seam at a time. Skip it only for pure config/
              scaffolding with no behavior to test yet.
            - Use the dart-flutter plugin's skills where they apply: architecture-best-practices
              when structuring new code, build-responsive-layout for any screen/widget work,
              add-widget-test when writing widget tests, use-primary-constructors for new Dart
              classes. Call the Skill tool for these rather than guessing the convention.

            ## Do the work
            1. Implement the chosen task under flutter/.
            2. Run `flutter analyze`, `flutter test`, and `flutter build apk --debug` — must
               be clean. The workflow now sets up the Android SDK, so the debug APK build is
               a required check like the other two, not optional.
            3. Commit everything on your branch with a message describing the task done.
            4. Push the branch and open a PR to master
               (`gh pr create --base master --head <branch> --title "..." --body "..."`).
               Do not merge it.
            5. If the task came from an issue: reference it in the PR body ("Closes #N") so it
               auto-closes on merge, and relabel it `ai-in-review` (remove `ai-in-progress`).
               Do not close the issue yourself.
               If it came from TASKS.md: check its box, commit that too.

            ## If you get stuck
            If the task can't be completed (unclear requirement, broken environment, a decision
            only a human can make), stop, comment on the issue explaining why, relabel it
            `ai-blocked` (remove `ai-in-progress`), and do not push a broken commit.

            ## If Claude is rate-limited (expected — the subscription budget is shared)
            If you get a rate-limit error, or cannot start because the budget is exhausted:
            stop immediately. Remove `ai-in-progress`, re-add `ai-ready`, comment
            "Loop hit the Claude rate limit — will retry next run", and exit. Never leave an
            issue stuck in `ai-in-progress`. (The reaper job also resets issues stuck there
            for >2h, but don't rely on it.)

            Keep the task small: if it needs more than ~15 rounds of tool use, stop after the
            first coherent slice, commit it with a TODO note, and describe the remainder in
            the PR body so a follow-up issue can be filed.

            ## Bash notes (avoid permission walls in this non-interactive run)
            - Use `git -C <dir> ...` instead of `cd <dir> && git ...` — the latter is always
              held for approval and there's no human here to approve it.
            - Use `rm`/`rm -r`, never `find ... -delete` — same reason.
            - Prefer plain `mkdir`/`mv`/`rm`/`cp` over chaining them with `&&` in one command
              where you can — chained commands are checked part-by-part and are more likely to
              hit something unapproved.

            Do not touch master directly. Do not do more than one task.

          claude_args: |
            --allowedTools "Read,Write,Edit,Skill,Bash(flutter:*),Bash(dart:*),Bash(git:*),Bash(gh pr:*),Bash(gh issue:*),Bash(gh label:*),Bash(mkdir:*),Bash(mv:*),Bash(rm:*),Bash(rmdir:*),Bash(cp:*)"
