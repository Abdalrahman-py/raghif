name: Flutter Port Loop

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch: # manual trigger

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prep working branch
        run: |
          git config user.name "raghif-loop-bot"
          git config user.email "actions@github.com"
          git checkout flutter-port 2>/dev/null || git checkout -b flutter-port
          git merge --no-edit master || true

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true # TEMP: debugging the 21 permission denials from the last run

          # Official Dart/Flutter skills plugin (flutter/agent-plugins) — architecture,
          # responsive layout, widget tests, primary constructors, etc.
          plugin_marketplaces: "https://github.com/flutter/agent-plugins.git"
          plugins: "dart-flutter@dart-flutter"

          prompt: |
            REPO: ${{ github.repository }}
            BRANCH: flutter-port

            This is a ralph-loop style run: do exactly ONE task, then stop.

            ## Pick the task
            This repo uses a label lifecycle for the loop: `ai-ready` (pick this up) →
            `ai-in-progress` (you're on it) → `ai-in-review` (PR open, waiting on human) →
            `ai-blocked` (stuck, needs human input — never pick these up).

            1. `gh issue list --state open --label ai-ready` — if any, take the highest
               priority one (label `p0` > `p1` > `p2`; unlabeled priority = lowest), oldest
               first as tiebreaker. Immediately relabel it `ai-in-progress` (remove `ai-ready`)
               so a concurrent run won't double-pick it.
            2. If there are no `ai-ready` issues, fall back to TASKS.md — pick the next
               unchecked task, top to bottom, respecting its "Notes for the loop" section.

            Source of truth: spec.md (product + Supabase schema), UI_SPEC.md (design tokens).
            The Kotlin app under app/ is a throwaway prototype — reference for behavior only,
            do not port its structure.

            ## Skills — use them, don't just read code
            - Use the `tdd` skill for any behavior change under flutter/: red (failing test)
              before green (implementation), one seam at a time. Skip it only for pure config/
              scaffolding with no behavior to test yet.
            - Use the dart-flutter plugin's skills where they apply: architecture-best-practices
              when structuring new code, build-responsive-layout for any screen/widget work,
              add-widget-test when writing widget tests, use-primary-constructors for new Dart
              classes. Call the Skill tool for these rather than guessing the convention.

            ## Do the work
            1. Implement the chosen task under flutter/.
            2. Run `flutter analyze` and `flutter test` — must be clean.
            3. Commit everything on the current branch (already checked out as flutter-port)
               with a message describing the task done.
            4. Push the branch: `git push origin flutter-port`.
            5. Open a PR to master if one doesn't already exist for this branch
               (`gh pr create --base master --head flutter-port --title "..." --body "..."`),
               otherwise leave the existing PR as is — do not merge it.
            6. If the task came from an issue: comment on it with what shipped and a link to
               the PR, then relabel it `ai-in-review` (remove `ai-in-progress`). Only close an
               issue once its PR is merged — never close it yourself here.
               If it came from TASKS.md: check its box instead.

            ## If you get stuck
            If the task can't be completed (unclear requirement, broken environment, a decision
            only a human can make), stop, comment on the issue explaining why, relabel it
            `ai-blocked` (remove `ai-in-progress`), and do not push a broken commit.

            Do not touch master directly. Do not do more than one task.

          claude_args: |
            --allowedTools "Read,Write,Edit,Skill,Bash(flutter:*),Bash(dart:*),Bash(git:*),Bash(gh pr:*),Bash(gh issue:*),Bash(gh label:*)"
