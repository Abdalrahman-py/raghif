name: Flutter Port Loop

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch: # manual trigger

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prep working branch
        run: |
          git config user.name "raghif-loop-bot"
          git config user.email "actions@github.com"
          git checkout flutter-port 2>/dev/null || git checkout -b flutter-port
          git merge --no-edit master || true

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            BRANCH: flutter-port

            This is a ralph-loop style run: read TASKS.md, do exactly ONE unchecked task
            (top to bottom, respecting the "Notes for the loop" section), then stop.

            Source of truth: spec.md (product + Supabase schema), UI_SPEC.md (design tokens).
            The Kotlin app under app/ is a throwaway prototype — reference for behavior only,
            do not port its structure.

            Steps:
            1. Read TASKS.md and pick the next task.
            2. Do the work under flutter/.
            3. Run `flutter analyze` and `flutter test` (if tests exist) — must be clean.
            4. Check the task's box in TASKS.md.
            5. Commit everything on the current branch (already checked out as flutter-port)
               with a message describing the task done.
            6. Push the branch: `git push origin flutter-port`.
            7. Open a PR to master if one doesn't already exist for this branch
               (`gh pr create --base master --head flutter-port --title "..." --body "..."`),
               otherwise leave the existing PR as is — do not merge it.

            Do not touch master directly. Do not do more than one task.

          claude_args: |
            --allowedTools "Read,Write,Edit,Bash(flutter:*),Bash(dart:*),Bash(git:*),Bash(gh pr:*)"
