name: Update goldens (temporary, manual)

on:
  workflow_dispatch:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: Install dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Regenerate goldens on this runner's fonts
        working-directory: flutter
        run: flutter test --update-goldens test/goldens/ || true

      - name: Upload regenerated goldens
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-goldens
          path: flutter/test/goldens/*.png
          if-no-files-found: error
