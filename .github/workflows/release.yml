name: Release APK

# Once per merge to master (or on demand): build the APK and replace the
# rolling "latest" release, so the newest build is one click away for
# installs without an app store. Tests already ran on the pull request.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # create/replace the rolling release

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/flutter

      # Gradle is the slow part of an Android build; cache its wrapper and jars.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            flutter/android/gradle/wrapper/gradle-wrapper.properties
            flutter/android/**/*.gradle.kts

      - run: yes | flutter doctor --android-licenses || true

      # The shared Flutter action writes .env from .env.example (dummy values,
      # fine for tests). A shipped APK needs the real backend, so overwrite it
      # here and fail loudly rather than publish an app that cannot log in.
      # Both values ship inside the APK anyway, so repo Variables are the
      # natural home; secrets of the same name also work.
      - name: Write real .env
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        working-directory: flutter
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Set repo variables (or secrets) SUPABASE_URL and SUPABASE_ANON_KEY"
            exit 1
          fi
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env

      # Real release keystore (build.gradle.kts reads android/key.properties,
      # storeFile relative to android/app/). No fallback: a fresh runner's
      # debug key differs every run, so phones could never update the app.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: flutter/android
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Set repo secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > key.properties

      # arm64-v8a only: it covers virtually every Android phone of the last
      # ~6 years and skips the other ABIs' unstripped libraries.
      - run: flutter build apk --release --target-platform android-arm64
        working-directory: flutter

      # Fail the release if the APK is unsigned or Gradle fell back to debug.
      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERTS=$("$APKSIGNER" verify --print-certs flutter/build/app/outputs/flutter-apk/app-release.apk)
          echo "$CERTS"
          if echo "$CERTS" | grep -q "CN=Android Debug"; then
            echo "::error::APK is signed with the debug key, not the release keystore"
            exit 1
          fi

      - name: Replace the rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest flutter/build/app/outputs/flutter-apk/app-release.apk \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA} (${GITHUB_REF_NAME})" \
            --target "${GITHUB_SHA}"
