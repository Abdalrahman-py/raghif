name: Release APK

# Once per merge to master (or on demand): build the APK and replace the
# rolling "latest" release, so the newest build is one click away for
# installs without an app store. Tests already ran on the pull request.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # create/replace the rolling release

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/flutter

      # Gradle is the slow part of an Android build; cache its wrapper and jars.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            flutter/android/gradle/wrapper/gradle-wrapper.properties
            flutter/android/**/*.gradle.kts

      - run: yes | flutter doctor --android-licenses || true

      # arm64-v8a only: it covers virtually every Android phone of the last
      # ~6 years and skips the other ABIs' unstripped libraries. Release signs
      # with the debug keystore (android/app/build.gradle.kts), so no secret.
      - run: flutter build apk --release --target-platform android-arm64
        working-directory: flutter

      - name: Replace the rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest flutter/build/app/outputs/flutter-apk/app-release.apk \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA} (${GITHUB_REF_NAME})" \
            --target "${GITHUB_SHA}"
