name: Flutter CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Pin Flutter to the version the project was created with (see flutter/.metadata,
      # revision db50e20168 = 3.41.6): its Android template (AGP 8.9.1, Gradle wrapper 8.12)
      # is what the repo is set up for. Current stable requires a newer Gradle (>= 8.14),
      # which broke builds until this pin. Bump this when you upgrade Flutter locally.
      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: Install dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Analyze
        working-directory: flutter
        run: flutter analyze

      - name: Test
        working-directory: flutter
        run: flutter test

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build debug APK
        working-directory: flutter
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: raghif-debug-apk
          path: flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  # Rolling "latest" release so the debug APK is one click away (App Store-less
  # installs). Runs on master pushes and manual dispatches, never on PRs.
  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create/update the rolling release
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: raghif-debug-apk
          path: apk

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Replace the previous "latest" release so assets never accumulate
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest apk/app-debug.apk \
            --title "Latest debug build" \
            --notes "Auto-built from commit \`${{ github.sha }}\` (${{ github.ref_name }})" \
            --target "${{ github.sha }}"

