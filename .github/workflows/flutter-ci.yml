name: Flutter CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # Pin Flutter to the version the project was created with (see flutter/.metadata,
      # revision db50e20168 = 3.41.6): its Android template (AGP 8.9.1, Gradle wrapper 8.12)
      # is what the repo is set up for. Current stable requires a newer Gradle (>= 8.14),
      # which broke builds until this pin. Bump this when you upgrade Flutter locally.
      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: Install dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Analyze
        working-directory: flutter
        run: flutter analyze

      # --timeout bounds each test individually: a hung stream/pumpAndSettle
      # fails fast with a stack trace instead of silently eating the whole
      # job's 30-minute budget. --reporter expanded prints each test as it
      # runs so a hang shows exactly which test it's stuck on.
      - name: Test
        working-directory: flutter
        run: flutter test --reporter expanded --timeout 60s

      # JDK/Gradle only needed past this point (release build). Deferred here
      # so a lint/test failure above skips this setup cost entirely.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Every run is a fresh VM. flutter-action's cache:true above covers the
      # Flutter SDK + pub packages; the slow part is Gradle — without this cache
      # each build re-downloads the 8.12 distribution + all Maven deps (~4 min).
      - name: Cache Gradle (wrapper dist + dependency jars)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('flutter/android/gradle/wrapper/gradle-wrapper.properties', 'flutter/android/app/build.gradle.kts', 'flutter/android/settings.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true

      # Release, arm64-v8a only: a debug build ships the ~80MB Dart JIT kernel
      # (kernel_blob.bin + isolate_snapshot_data) that release's AOT compile
      # skips entirely, plus unstripped debug .so's for every ABI. Release
      # signs with the debug keystore (see android/app/build.gradle.kts), so
      # no signing secret is needed. arm64-v8a alone covers virtually every
      # physical Android device from the last ~6 years.
      - name: Build release APK (arm64-v8a only)
        working-directory: flutter
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: raghif-release-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # Rolling "latest" release so the release APK is one click away (App
  # Store-less installs). Runs on master pushes and manual dispatches, never on PRs.
  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create/update the rolling release
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: raghif-release-apk
          path: apk

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Replace the previous "latest" release so assets never accumulate.
          # --repo is required: this job never checks out, so gh has no git
          # context to infer the repository from.
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest --repo "$GITHUB_REPOSITORY" apk/app-release.apk \
            --title "Latest build" \
            --notes "Auto-built from commit \`${{ github.sha }}\` (${{ github.ref_name }})" \
            --target "${{ github.sha }}"

