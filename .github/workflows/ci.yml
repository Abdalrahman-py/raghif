name: CI

# Pull requests and pushes to master: does it analyze cleanly and do the tests
# pass. No branch filter on pull_request, so stacked PRs that target a parent
# branch are covered. Nothing here builds the Android app; that happens once per
# merge (release.yml).
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/flutter
      - run: flutter analyze
      # Expanded reporter + a per-test timeout so a leaked Drift connection
      # shows up as a named, stack-traced failure instead of a stalled job.
      - run: flutter test --reporter expanded --timeout 60s
