name: raghif
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+2

environment:
  sdk: ^3.9.2
  # The one place the Flutter version is pinned: local pub get, CI and the
  # release build all read it. Bump with the Gradle wrapper (>= 8.14).
  flutter: 3.47.5
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.1
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.9.2
  flutter_dotenv: ^5.2.1
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  crypto: ^3.0.7
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  equatable: ^2.0.7
  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0
  intl: ^0.20.2
  easy_localization: ^3.0.7
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  flutter_local_notifications: ^18.0.1
  share_plus: ^10.1.4
  gal: ^2.3.3
  mobile_scanner: ^7.4.0
  # Scan feedback tones (success ding / error buzz). Held below 6.8.0 on
  # purpose: that release needs Flutter >=3.44, while CI builds on the pinned
  # 3.41.6 — a caret would resolve to it locally and break CI.
  audioplayers: '>=6.7.1 <6.8.0'

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.15.1
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
    - .env

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-VariableFont.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-VariableFont.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-VariableFont.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-VariableFont.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0369A1"
  adaptive_icon_foreground: "assets/images/app_icon.png"

# The native launch resources are maintained in android/app/src/main/res
# with the Stitch vector emblem; the interactive screen lives in main.dart.
